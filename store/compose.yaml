services:
  store-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: store
    volumes:
      - store-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
  
  store-migrations:
    build:
      context: .
      dockerfile: owner/Dockerfile
    environment:
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_URL: store-db
      DATABASE_NAME: store
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    command: ["flask", "--app", "owner.app", "db", "upgrade"]
    volumes:
      - ./common/migrations:/app/migrations
    depends_on:
      store-db:
        condition: service_healthy
        restart: true
    restart: "no"
  
  owner:
    build:
      context: .
      dockerfile: owner/Dockerfile
    environment:
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_URL: store-db
      DATABASE_NAME: store
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    ports:
      - "5001:5000"
    volumes:
      - ./common/migrations:/app/migrations
    depends_on:
      store-migrations:
        condition: service_completed_successfully
        restart: true
  
  customer:
    build:
      context: .
      dockerfile: customer/Dockerfile
    environment:
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_URL: store-db
      DATABASE_NAME: store
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    ports:
      - "5002:5000"
    volumes:
      - ./common/migrations:/app/migrations
    depends_on:
      store-migrations:
        condition: service_completed_successfully
        restart: true

volumes:
  store-db-data:
